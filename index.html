<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Detox 21">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Detox 21 — Patrik Rees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --black: #0a0a0a;
  --white: #ffffff;
  --off-white: #fafafa;
  --muted: #999999;
  --muted-light: #cccccc;
  --border: #e8e8e8;
  --border-dark: #222222;
  --green: #3a5c45;
  --green-subtle: #f2f5f3;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--white);
  color: var(--black);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overscroll-behavior: none;
}

/* ── HEADER ── */
.header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding-top: var(--safe-top);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  padding: 0 1.25rem;
}
.header-wordmark {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 400;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--black);
}
.header-day {
  font-family: var(--serif);
  font-size: .85rem;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: .05em;
}

/* ── NAV ── */
.nav {
  display: flex;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav-tab {
  flex: 1;
  min-width: 60px;
  background: none;
  border: none;
  padding: .7rem .5rem;
  font-family: var(--sans);
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  position: relative;
  transition: color .2s;
  white-space: nowrap;
}
.nav-tab.active { color: var(--black); }
.nav-tab.active::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: var(--black);
}

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }

/* ── SECTIONS ── */
.section { padding: 1.75rem 1.25rem; }
.section + .section { border-top: 1px solid var(--border); }
.section-label {
  font-family: var(--sans);
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1.25rem;
}

/* ── HERO ── */
.hero {
  background: var(--black);
  color: var(--white);
  padding: 2.5rem 1.25rem 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero-kicker {
  font-family: var(--sans);
  font-size: .58rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.4);
  margin-bottom: 1rem;
}
.hero-day-num {
  font-family: var(--serif);
  font-size: 5.5rem;
  font-weight: 300;
  line-height: 1;
  color: var(--white);
}
.hero-day-total {
  font-family: var(--serif);
  font-size: 1.8rem;
  font-weight: 300;
  color: rgba(255,255,255,.35);
}
.hero-divider {
  width: 40px;
  height: 1px;
  background: rgba(255,255,255,.2);
  margin: 1.25rem auto;
}
.hero-date {
  font-family: var(--sans);
  font-size: .7rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.5);
  margin-bottom: .4rem;
}
.hero-theme {
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 400;
  font-style: italic;
  color: rgba(255,255,255,.85);
  margin-bottom: .35rem;
}
.hero-recipe {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 300;
  color: rgba(255,255,255,.55);
}
.hero-protocol-day {
  font-family: var(--sans);
  font-size: .6rem;
  font-weight: 400;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  margin-top: .4rem;
}

/* ── TIMER ── */
.timer-wrap {
  border-bottom: 1px solid var(--border);
  padding: 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.timer-label {
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
}
.timer-meal {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 400;
  margin-top: .15rem;
}
.timer-countdown {
  font-family: var(--serif);
  font-size: 2.2rem;
  font-weight: 300;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* ── PROGRESS ── */
.progress-section {
  padding: 1.25rem;
  border-bottom: 1px solid var(--border);
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: .75rem;
}
.progress-label-text {
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
}
.progress-fraction {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 300;
  color: var(--black);
}
.progress-bar-track {
  height: 1px;
  background: var(--border);
  position: relative;
  margin-bottom: 1rem;
}
.progress-bar-fill {
  position: absolute;
  top: 0; left: 0; height: 1px;
  background: var(--black);
  transition: width .6s cubic-bezier(.4,0,.2,1);
}
.progress-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.p-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .55rem;
  font-weight: 500;
  color: var(--muted-light);
  cursor: pointer;
  transition: all .2s;
  font-family: var(--sans);
}
.p-dot.done {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}
.p-dot.today {
  border-color: var(--black);
  color: var(--black);
  font-weight: 600;
}
.p-dot.today.done {
  background: var(--black);
  color: var(--white);
}

/* ── MEAL LIST ── */
.meal-item {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  -webkit-user-select: none;
  user-select: none;
}
.meal-item:active { background: var(--off-white); }
.meal-item.checked { background: var(--off-white); }
.meal-check-box {
  width: 18px;
  height: 18px;
  min-width: 18px;
  border: 1px solid var(--muted-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .65rem;
  transition: all .2s;
  margin-top: .15rem;
  flex-shrink: 0;
}
.meal-item.checked .meal-check-box {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}
.meal-item.current .meal-check-box {
  border-color: var(--black);
}
.meal-body { flex: 1; min-width: 0; }
.meal-time-row {
  display: flex;
  align-items: center;
  gap: .6rem;
  margin-bottom: .2rem;
}
.meal-time {
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--muted);
  font-family: var(--sans);
}
.meal-name {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.2;
}
.meal-item.checked .meal-name { color: var(--muted); }
.meal-desc {
  font-size: .75rem;
  color: var(--muted);
  line-height: 1.4;
  margin-top: .15rem;
}
.meal-badge {
  font-size: .55rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--black);
  border: 1px solid var(--black);
  padding: .15rem .45rem;
  align-self: flex-start;
  margin-top: .15rem;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── DAY COMPLETE ── */
.day-complete {
  padding: 2rem 1.25rem;
  text-align: center;
  border-top: 1px solid var(--border);
}
.day-complete-title {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 300;
  font-style: italic;
  margin-bottom: .4rem;
}
.day-complete-sub {
  font-size: .75rem;
  color: var(--muted);
  letter-spacing: .05em;
}

/* ── RECIPE PAGE ── */
.recipe-day-nav {
  display: flex;
  overflow-x: auto;
  gap: 0;
  border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.recipe-day-nav::-webkit-scrollbar { display: none; }
.recipe-day-btn {
  flex-shrink: 0;
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  padding: .65rem .9rem;
  font-family: var(--sans);
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  line-height: 1.5;
}
.recipe-day-btn.active {
  background: var(--black);
  color: var(--white);
  border-color: var(--black);
}
.recipe-header { padding: 2rem 1.25rem 1.25rem; border-bottom: 1px solid var(--border); }
.recipe-tag {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .75rem;
}
.recipe-title {
  font-family: var(--serif);
  font-size: 1.8rem;
  font-weight: 300;
  line-height: 1.2;
  margin-bottom: .5rem;
}
.recipe-meta-row {
  display: flex;
  gap: 1rem;
  font-size: .65rem;
  color: var(--muted);
  letter-spacing: .05em;
}
.recipe-note {
  font-size: .78rem;
  font-style: italic;
  color: var(--muted);
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: var(--off-white);
}
.recipe-section-label {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 1.25rem 1.25rem .6rem;
}
.recipe-ing-list { list-style: none; }
.recipe-ing-list li {
  display: flex;
  gap: .75rem;
  padding: .65rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: .88rem;
  line-height: 1.4;
  align-items: flex-start;
}
.recipe-ing-list li::before {
  content: '—';
  color: var(--muted-light);
  flex-shrink: 0;
  font-weight: 300;
}
.recipe-steps-list {
  list-style: none;
  counter-reset: steps;
}
.recipe-steps-list li {
  counter-increment: steps;
  display: flex;
  gap: 1rem;
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: .875rem;
  line-height: 1.5;
  align-items: flex-start;
}
.recipe-steps-list li::before {
  content: counter(steps);
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 300;
  color: var(--muted-light);
  flex-shrink: 0;
  min-width: 16px;
  text-align: right;
  margin-top: -.05rem;
}

/* ── CALENDAR PAGE ── */
.cal-month-label {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 300;
  font-style: italic;
  padding: 1.5rem 1.25rem .75rem;
  border-bottom: 1px solid var(--border);
  color: var(--black);
}
.cal-week-headers {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
}
.cal-wh {
  font-size: .55rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  padding: .5rem 0;
  border-right: 1px solid var(--border);
}
.cal-wh:last-child { border-right: none; }
.cal-grid-wrap {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}
.cal-cell {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: .6rem .4rem;
  cursor: pointer;
  transition: background .15s;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell:active { background: var(--off-white); }
.cal-cell-num {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 300;
  color: var(--muted-light);
}
.cal-cell-date { font-size: .5rem; color: var(--muted-light); letter-spacing: .05em; }
.cal-cell-rec {
  font-size: .5rem;
  font-weight: 500;
  letter-spacing: .08em;
  color: var(--muted-light);
  text-transform: uppercase;
}
.cal-cell.done .cal-cell-num { color: var(--black); }
.cal-cell.done .cal-cell-date,
.cal-cell.done .cal-cell-rec { color: var(--muted); }
.cal-cell.done { background: var(--off-white); }
.cal-cell.today { background: var(--black); }
.cal-cell.today .cal-cell-num,
.cal-cell.today .cal-cell-date,
.cal-cell.today .cal-cell-rec { color: var(--white); }
.cal-detail {
  border-top: 1px solid var(--border);
}

/* ── RULES PAGE ── */
.rules-hero {
  background: var(--black);
  color: var(--white);
  padding: 2rem 1.25rem;
  text-align: center;
}
.rules-hero-kicker {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.4);
  margin-bottom: .75rem;
}
.rules-hero-title {
  font-family: var(--serif);
  font-size: 1.6rem;
  font-weight: 300;
  font-style: italic;
  color: var(--white);
}
.rule-row {
  display: flex;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.rule-num {
  font-family: var(--serif);
  font-size: 1.3rem;
  font-weight: 300;
  color: var(--muted-light);
  min-width: 20px;
  flex-shrink: 0;
}
.rule-text {
  font-size: .875rem;
  line-height: 1.5;
  padding-top: .15rem;
}
.rule-text strong { font-weight: 500; }

/* ── FRUIT LIST ── */
.fruit-grid {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  padding: 0 1.25rem 1.25rem;
}
.fruit-tag {
  font-size: .72rem;
  color: var(--black);
  border: 1px solid var(--border);
  padding: .25rem .65rem;
  letter-spacing: .03em;
}
.fruit-avoid-note {
  font-size: .75rem;
  color: var(--muted);
  font-style: italic;
  padding: 0 1.25rem 1.25rem;
}

/* ── SHOPPING PAGE ── */
.shop-group-label {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 1.25rem 1.25rem .6rem;
  border-bottom: 1px solid var(--border);
}
.shop-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  -webkit-user-select: none;
  user-select: none;
}
.shop-row:active { background: var(--off-white); }
.shop-box {
  width: 16px;
  height: 16px;
  min-width: 16px;
  border: 1px solid var(--muted-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .6rem;
  transition: all .2s;
  flex-shrink: 0;
}
.shop-row.bought .shop-box {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}
.shop-row.bought .shop-label {
  text-decoration: line-through;
  color: var(--muted);
}
.shop-label { font-size: .875rem; line-height: 1.4; }
.shop-reset-row {
  padding: 1.25rem;
  text-align: center;
  border-top: 1px solid var(--border);
}
.btn-outline {
  background: none;
  border: 1px solid var(--black);
  color: var(--black);
  padding: .6rem 1.5rem;
  font-family: var(--sans);
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
}
.btn-outline:hover { background: var(--black); color: var(--white); }

/* ── MENU PAGE ── */
.menu-page { padding: 1.5rem 1.25rem 3rem; }
.menu-page-title {
  font-family: var(--serif);
  font-size: 1.6rem;
  font-weight: 300;
  font-style: italic;
  margin-bottom: .35rem;
}
.menu-page-sub {
  font-size: .72rem;
  color: var(--muted);
  letter-spacing: .04em;
  margin-bottom: 1.75rem;
}
.menu-upload-zone {
  border: 1px dashed var(--muted-light);
  border-radius: 2px;
  padding: 2.5rem 1.25rem;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  position: relative;
  margin-bottom: 1.25rem;
}
.menu-upload-zone:hover { border-color: var(--black); background: var(--off-white); }
.menu-upload-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.menu-upload-icon {
  font-size: 2rem;
  margin-bottom: .75rem;
  opacity: .35;
}
.menu-upload-label {
  font-size: .72rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.menu-preview {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 2px;
  display: block;
  margin-bottom: 1.25rem;
  border: 1px solid var(--border);
}
.menu-btn {
  width: 100%;
  background: var(--black);
  color: var(--white);
  border: none;
  padding: .85rem 1.5rem;
  font-family: var(--sans);
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity .2s;
  margin-bottom: 1.75rem;
}
.menu-btn:disabled { opacity: .4; cursor: default; }
.menu-loading {
  text-align: center;
  padding: 2rem 0;
  font-size: .8rem;
  color: var(--muted);
  letter-spacing: .06em;
  display: none;
}
.menu-loading.visible { display: block; }
.menu-result { display: none; }
.menu-result.visible { display: block; }
.menu-result-section {
  padding: 1.25rem 0;
  border-top: 1px solid var(--border);
}
.menu-result-section:first-child { border-top: none; }
.menu-result-kicker {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .6rem;
}
.menu-result-body {
  font-size: .9rem;
  line-height: 1.65;
  color: var(--black);
}
.menu-result-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.menu-result-list li {
  font-size: .875rem;
  line-height: 1.6;
  color: var(--black);
  padding: .2rem 0;
  padding-left: 1rem;
  position: relative;
}
.menu-result-list li::before {
  content: '—';
  position: absolute;
  left: 0;
  color: var(--muted-light);
}
.menu-risk-badge {
  display: inline-block;
  font-size: .62rem;
  font-weight: 500;

const getState = () => { try { return JSON.parse(localStorage.getItem('d21') || '{}'); } catch { return {}; } };
const setState = s => localStorage.setItem('d21', JSON.stringify(s));

function getTotalDay() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const start = new Date(2026, 4, 3); // 3 maj — total protokollstart
  return Math.floor((today - start) / 86400000) + 1;
}

function getGreenPhaseDay() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const start = new Date(2026, 4, 24); // 24 maj — grön fas start
  return Math.floor((today - start) / 86400000) + 1;
}

function getCurrentMealIdx() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const times = [6*60+15, 9*60, 12*60, 15*60, 18*60, 21*60];
  let idx = -1;
  for (let i = 0; i < times.length; i++) if (mins >= times[i] - 15) idx = i;
  return idx;
}

function getNextMealIdx() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const times = [6*60+15, 9*60, 12*60, 15*60, 18*60, 21*60];
  for (let i = 0; i < times.length; i++) if (mins < times[i]) return i;
  return -1;
}

function getSecsToNext() {
  const now = new Date();
  const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const times = [(6*60+15)*60, 9*60*60, 12*60*60, 15*60*60, 18*60*60, 21*60*60];
  for (let i = 0; i < times.length; i++) if (secs < times[i]) return { idx: i, secs: times[i] - secs };
  return { idx: 0, secs: 86400 - secs + (6*60+15)*60 };
}

// ─── RENDER TODAY ─────────────────────────────────────────────────────────────

function renderToday() {
  const totalDay = getTotalDay();
  const greenDay = getGreenPhaseDay();
  const el = document.getElementById('page-today');
  const headerLabel = document.getElementById('header-day-label');

  if (totalDay < 1) {
    headerLabel.textContent = 'Protokollet startar 3 maj';
    el.innerHTML = `
      <div class="pre-start">
        <div class="pre-start-kicker">3 maj 2026</div>
        <div class="pre-start-title">Protokollet startar 3 maj</div>
        <div class="pre-start-body">Förberedelsefas börjar kl. 06:15.<br>Grön fas startar 24 maj.</div>
      </div>`;
    return;
  }

  if (greenDay < 1) {
    const daysLeft = -greenDay + 1;
    headerLabel.textContent = `Protokolldag ${totalDay}`;
    el.innerHTML = `
      <div class="pre-start">
        <div class="pre-start-kicker">Protokolldag ${totalDay}</div>
        <div class="pre-start-title">Grön fas om ${daysLeft} dag${daysLeft === 1 ? '' : 'ar'}</div>
        <div class="pre-start-body">Grön fas startar 24 maj — dag 1 av 21.</div>
      </div>`;
    return;
  }

  if (greenDay > 21) {
    headerLabel.textContent = 'Genomfört';
    el.innerHTML = `
      <div class="pre-start">
        <div class="pre-start-kicker">13 juni 2026</div>
        <div class="pre-start-title">Grön fas genomförd</div>
        <div class="pre-start-body">Patrik Rees — 21 dagar klara.</div>
      </div>`;
    return;
  }

  const n = greenDay; // all meal/recipe logic uses Green Phase Day
  const day = DAYS[n - 1];
  const state = getState();
  headerLabel.textContent = `Grön fas dag ${n}`;

  // HERO — shows both Green Phase Day and Total Protocol Day
  let hero = `
    <div class="hero">
      <div class="hero-kicker">Patrik Rees · MediBalans</div>
      <div class="hero-day-num">${n}<span class="hero-day-total"> /21</span></div>
      <div class="hero-protocol-day">Protokolldag ${totalDay}</div>
      <div class="hero-divider"></div>
      <div class="hero-date">${day.wd} ${day.date}</div>
      <div class="hero-theme">${day.theme}</div>
      <div class="hero-recipe">${day.name}</div>
    </div>`;

  // TIMER
  const nextInfo = getSecsToNext();
  const nextMeal = MEALS[nextInfo.idx];
  const h = Math.floor(nextInfo.secs / 3600);
  const m = Math.floor((nextInfo.secs % 3600) / 60);
  const s = nextInfo.secs % 60;
  const timeStr = h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;

  let timer = `
    <div class="timer-wrap">
      <div>
        <div class="timer-label">Nastan dags</div>
        <div class="timer-meal">${nextMeal.time} — ${nextMeal.name}</div>
      </div>
      <div class="timer-countdown" id="timer-val">${timeStr}</div>
    </div>`;

  // PROGRESS
  const done = Math.min(n - 1, 21);
  const pct = Math.round(done / 21 * 100);
  let dots = '';
  for (let i = 1; i <= 21; i++) {
    const isDone = getState()[`day_done_${i}`] || i < n;
    const isToday = i === n;
    let cls = 'p-dot';
    if (isDone) cls += ' done';
    if (isToday) cls += ' today';
    dots += `<div class="${cls}" title="Dag ${i}">${i === 21 ? '★' : i}</div>`;
  }
  let progress = `
    <div class="progress-section">
      <div class="progress-meta">
        <div class="progress-label-text">Genomfort</div>
        <div class="progress-fraction">${done} / 21</div>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-dots">${dots}</div>
    </div>`;

  // MEALS
  const curIdx = getCurrentMealIdx();
  const nxtIdx = getNextMealIdx();
  let meals = `<div class="section-label" style="padding:1rem 1.25rem .1rem;">Dagens schema</div>`;

  MEALS.forEach((meal, i) => {
    const key = `d${n}_${meal.key}`;
    const checked = !!state[key];
    const isCurrent = i === curIdx;
    const isNext = i === nxtIdx;
    const desc = meal.isRecipe ? `${meal.desc} — ${day.name}${day.protein ? ' (' + day.protein + ')' : ''}` : meal.desc;

    let cls = 'meal-item';
    if (checked) cls += ' checked';
    else if (isCurrent) cls += ' current';

    let badge = '';
    if (!checked && isCurrent) badge = '<div class="meal-badge">Nu</div>';
    else if (!checked && isNext) badge = '<div class="meal-badge">Nastan</div>';

    meals += `
      <div class="${cls}" onclick="toggleMeal('${key}', ${n})">
        <div class="meal-check-box">${checked ? '✓' : ''}</div>
        <div class="meal-body">
          <div class="meal-time-row">
            <span class="meal-time">${meal.time}</span>
          </div>
          <div class="meal-name">${meal.name}</div>
          <div class="meal-desc">${desc}</div>
        </div>
        ${badge}
      </div>`;
  });

  // Day complete check
  const allDone = MEALS.every(m => state[`d${n}_${m.key}`]);
  if (allDone) {
    const s2 = getState(); s2[`day_done_${n}`] = true; setState(s2);
    const nextDay = n < 21 ? DAYS[n] : null;
    meals += `
      <div class="day-complete">
        <div class="day-complete-title">${n === 21 ? 'Detoxen genomförd' : 'Dag ' + n + ' genomförd'}</div>
        <div class="day-complete-sub">${nextDay ? 'Imorgon: ' + nextDay.name : 'Patrik Rees — 21 dagar klara.'}</div>
      </div>`;
  }

  el.innerHTML = hero + timer + progress + meals;
}

window.toggleMeal = function(key, dayNum) {
  const s = getState();
  s[key] = !s[key];
  setState(s);
  renderToday();
};

    </div>
    <div class="recipe-note">${rec.note}</div>
    <div class="recipe-section-label">Ingredienser</div>
    <ul class="recipe-ing-list">${rec.ing.map(i => `<li>${i}</li>`).join('')}</ul>

  // Scroll active day button into view
  setTimeout(() => {
    const active = el.querySelector('.recipe-day-btn.active');

  }, 50);
}

// ─── RENDER CALENDAR ──────────────────────────────────────────────────────────

function renderCalendar() {
  const n = getGreenPhaseDay();
  const state = getState();
  const el = document.getElementById('page-calendar');

  const headers = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön']
    .map(h => `<div class="cal-wh">${h}</div>`).join('');

  const cells = DAYS.map((d, i) => {
    const num = i + 1;
    const isDone = state[`day_done_${num}`] || num < n;
    const isToday = num === n;
    let cls = 'cal-cell';
    if (isDone && !isToday) cls += ' done';
    if (isToday) cls += ' today';
    return `
      <div class="${cls}" onclick="showCalDetail(${num})">
        <div class="cal-cell-num">${num === 21 ? '★' : num}</div>
        <div class="cal-cell-date">${d.date}</div>
        <div class="cal-cell-rec">${d.recipe}</div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="cal-month-label">Maj – Juni 2026</div>
    <div class="cal-week-headers">${headers}</div>
    <div class="cal-grid-wrap">${cells}</div>
    <div class="cal-detail" id="cal-detail"></div>`;
}

window.showCalDetail = function(num) {
  const day = DAYS[num - 1];
  const rec = RECIPES[day.recipe];
  document.getElementById('cal-detail').innerHTML = `
    <div class="section-label" style="padding:1.25rem 1.25rem .6rem;">Dag ${num} — ${day.wd} ${day.date}</div>
    <div class="recipe-note" style="border-top:1px solid var(--border);">${day.name}${day.protein ? ' · ' + day.protein : ''}</div>
    <ul class="recipe-ing-list">${rec.ing.map(i => `<li>${i}</li>`).join('')}</ul>
    <div style="height:1rem;"></div>`;
};

// ─── RENDER SHOP ──────────────────────────────────────────────────────────────

function renderShop() {
  const state = getState();
  const el = document.getElementById('page-shop');

  const makeRows = (items, prefix) => items.map((item, i) => {
    const key = `shop_${prefix}_${i}`;
    const bought = !!state[key];
    return `
      <div class="shop-row ${bought ? 'bought' : ''}" onclick="toggleShop('${key}')">
        <div class="shop-box">${bought ? '✓' : ''}</div>
        <span class="shop-label">${item}</span>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="shop-group-label">Veckans bas — köp varje vecka (× 3)</div>
    ${makeRows(SHOP_WEEKLY, 'w')}
    <div class="shop-group-label">Engångsinköp — räcker hela perioden</div>
    ${makeRows(SHOP_ONCE, 'o')}
    <div class="shop-reset-row">
      <button class="btn-outline" onclick="resetShop()">Nollställ listan</button>
    </div>`;
}

window.toggleShop = function(key) {
  const s = getState(); s[key] = !s[key]; setState(s); renderShop();
};
window.resetShop = function() {
  const s = getState();
  Object.keys(s).filter(k => k.startsWith('shop_')).forEach(k => delete s[k]);
  setState(s); renderShop();
};

function renderMenu() {
  const el = document.getElementById('page-menu');
  if (el.dataset.rendered) return;
  el.dataset.rendered = '1';

  el.innerHTML = `
    <div class="menu-page">
      <div class="menu-page-title">Menyhjälp</div>
      <div class="menu-page-sub">Fotografera restaurangmenyn — AI:n väljer bästa rätt enligt dina detoxregler.</div>

      <div class="menu-upload-zone" id="menu-upload-zone">

      <img id="menu-preview" class="menu-preview" style="display:none;" alt="Menyförhandsvisning">

      <button class="menu-btn" id="menu-analyze-btn" disabled onclick="analyzeMenu()">Analysera meny</button>

      <div class="menu-error" id="menu-error"></div>

      <div class="menu-result" id="menu-result">
        <div class="menu-result-section">
          <div class="menu-result-kicker">Bästa val</div>
          <div class="menu-result-body" id="res-basta-val"></div>
        </div>
        <div class="menu-result-section">

        </div>
        <div class="menu-result-section">
          <div class="menu-result-kicker">Undvik helt</div>

        </div>
        <div class="menu-result-section">
          <div class="menu-result-kicker">Risknivå</div>
          <div id="res-risk-badge"></div>
          <div class="menu-risk-text" id="res-risk-text"></div>
        </div>
        <div class="menu-result-section">
          <div class="menu-result-kicker">Om inget funkar</div>
          <div class="menu-result-body" id="res-fallback"></div>
        </div>
      </div>
    </div>`;

  document.getElementById('menu-file-input').addEventListener('change', function() {
    const file = this.files[0];

    document.getElementById('menu-result').classList.remove('visible');
    document.getElementById('menu-error').classList.remove('visible');

}

function resizeImageToDataUrl(file, maxPx, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Kunde inte läsa bildfilen.'));
    reader.onload = () => {
      const dataUrl = reader.result;
      if (!dataUrl.startsWith('data:image')) {
        return reject(new Error('Bilden har fel format. Prova ett annat foto.'));
      }
      const img = new Image();
      img.onerror = () => reject(new Error('Bilden kunde inte avkodas.'));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else       { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  });
}

window.analyzeMenu = async function() {
  const fileInput = document.getElementById('menu-file-input');
  const file = fileInput.files[0];
  if (!file) return;

  const btn = document.getElementById('menu-analyze-btn');
  const loading = document.getElementById('menu-loading');
  const result = document.getElementById('menu-result');
  const errorEl = document.getElementById('menu-error');

  btn.disabled = true;
  loading.classList.add('visible');
  result.classList.remove('visible');
  errorEl.classList.remove('visible');

  try {
    // Resize to max 1024px and convert to JPEG to keep payload small and format consistent
    const image = await resizeImageToDataUrl(file, 1024, 0.85);

    const res = await fetch('/.netlify/functions/analyze-menu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image }),
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error || 'Okänt fel.');
    }

    document.getElementById('res-basta-val').textContent = data.basta_val ?? '—';

    const beOm = document.getElementById('res-be-om');
    beOm.innerHTML = (data.be_om_andring ?? []).map(t => `<li>${t}</li>`).join('') || '<li>Inga ändringar behövs.</li>';

    const undvik = document.getElementById('res-undvik');
    undvik.innerHTML = (data.undvik ?? []).map(t => `<li>${t}</li>`).join('') || '<li>—</li>';

    const risk = (data.riskniva ?? 'medium').toLowerCase().trim();
    const riskLabel = { low: 'Låg risk', medium: 'Medel risk', high: 'Hög risk' }[risk] ?? risk;
    document.getElementById('res-risk-badge').innerHTML = `<span class="menu-risk-badge ${risk}">${riskLabel}</span>`;
    document.getElementById('res-risk-text').textContent = data.riskniva_motivering ?? '';

    document.getElementById('res-fallback').textContent = data.om_inget_funkar ?? '—';

    result.classList.add('visible');
  } catch (err) {
    errorEl.textContent = err.message || 'Något gick fel. Försök igen.';
    errorEl.classList.add('visible');
  } finally {
    loading.classList.remove('visible');
    btn.disabled = false;
  }
};

// ─── NAV ─────────────────────────────────────────────────────────────────────

window.showPage = function(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  const order = ['today','recipe','calendar','rules','shop','menu'];
  document.querySelectorAll('.nav-tab')[order.indexOf(page)]?.classList.add('active');
  if (page === 'recipe') renderRecipe();
  if (page === 'calendar') renderCalendar();
  if (page === 'rules') renderRules();
  if (page === 'shop') renderShop();
  if (page === 'menu') renderMenu();
};

// ─── TIMER TICK ──────────────────────────────────────────────────────────────

function tickTimer() {
  const el = document.getElementById('timer-val');
  if (!el) return;
  const { secs } = getSecsToNext();
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  el.textContent = h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
}

// ─── PWA ─────────────────────────────────────────────────────────────────────

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

renderToday();
renderRules();
setInterval(tickTimer, 1000);
setInterval(() => {
  if (document.getElementById('page-today').classList.contains('active')) renderToday();
}, 60000);
</script>
