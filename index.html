<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Detox 21">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Detox 21 — Patrik Rees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --black: #0a0a0a;
  --white: #ffffff;
  --off-white: #fafafa;
  --muted: #999999;
  --muted-light: #cccccc;
  --border: #e8e8e8;
  --border-dark: #222222;
  --green: #3a5c45;
  --green-subtle: #f2f5f3;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--white);
  color: var(--black);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overscroll-behavior: none;
}

/* ── HEADER ── */
.header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding-top: var(--safe-top);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  padding: 0 1.25rem;
}
.header-wordmark {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 400;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--black);
}
.header-day {
  font-family: var(--serif);
  font-size: .85rem;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: .05em;
}

/* ── NAV ── */
.nav {
  display: flex;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav-tab {
  flex: 1;
  min-width: 60px;
  background: none;
  border: none;
  padding: .7rem .5rem;
  font-family: var(--sans);
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  position: relative;
  transition: color .2s;
  white-space: nowrap;
}
.nav-tab.active { color: var(--black); }
.nav-tab.active::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: var(--black);
}

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }

/* ── SECTIONS ── */
.section { padding: 1.75rem 1.25rem; }
.section + .section { border-top: 1px solid var(--border); }
.section-label {
  font-family: var(--sans);
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1.25rem;
}

/* ── HERO ── */
.hero {
  background: var(--black);
  color: var(--white);
  padding: 2.5rem 1.25rem 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero-kicker {
  font-family: var(--sans);
  font-size: .58rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.4);
  margin-bottom: 1rem;
}
.hero-day-num {
  font-family: var(--serif);
  font-size: 5.5rem;
  font-weight: 300;
  line-height: 1;
  color: var(--white);
}
.hero-day-total {
  font-family: var(--serif);
  font-size: 1.8rem;
  font-weight: 300;
  color: rgba(255,255,255,.35);
}
.hero-divider {
  width: 40px;
  height: 1px;
  background: rgba(255,255,255,.2);
  margin: 1.25rem auto;
}
.hero-date {
  font-family: var(--sans);
  font-size: .7rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.5);
  margin-bottom: .4rem;
}
.hero-theme {
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 400;
  font-style: italic;
  color: rgba(255,255,255,.85);
  margin-bottom: .35rem;
}
.hero-recipe {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 300;
  color: rgba(255,255,255,.55);
}

/* ── TIMER ── */
.timer-wrap {
  border-bottom: 1px solid var(--border);
  padding: 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.timer-label {
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
}
.timer-meal {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 400;
  margin-top: .15rem;
}
.timer-countdown {
  font-family: var(--serif);
  font-size: 2.2rem;
  font-weight: 300;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* ── PROGRESS ── */
.progress-section {
  padding: 1.25rem;
  border-bottom: 1px solid var(--border);
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: .75rem;
}
.progress-label-text {
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
}
.progress-fraction {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 300;
  color: var(--black);
}
.progress-bar-track {
  height: 1px;
  background: var(--border);
  position: relative;
  margin-bottom: 1rem;
}
.progress-bar-fill {
  position: absolute;
  top: 0; left: 0; height: 1px;
  background: var(--black);
  transition: width .6s cubic-bezier(.4,0,.2,1);
}
.progress-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.p-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .55rem;
  font-weight: 500;
  color: var(--muted-light);
  cursor: pointer;
  transition: all .2s;
  font-family: var(--sans);
}
.p-dot.done {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}
.p-dot.today {
  border-color: var(--black);
  color: var(--black);
  font-weight: 600;
}
.p-dot.today.done {
  background: var(--black);
  color: var(--white);
}

/* ── MEAL LIST ── */
.meal-item {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  -webkit-user-select: none;
  user-select: none;
}
.meal-item:active { background: var(--off-white); }
.meal-item.checked { background: var(--off-white); }
.meal-check-box {
  width: 18px;
  height: 18px;
  min-width: 18px;
  border: 1px solid var(--muted-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .65rem;
  transition: all .2s;
  margin-top: .15rem;
  flex-shrink: 0;
}
.meal-item.checked .meal-check-box {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}
.meal-item.current .meal-check-box {
  border-color: var(--black);
}
.meal-body { flex: 1; min-width: 0; }
.meal-time-row {
  display: flex;
  align-items: center;
  gap: .6rem;
  margin-bottom: .2rem;
}
.meal-time {
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--muted);
  font-family: var(--sans);
}
.meal-name {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.2;
}
.meal-item.checked .meal-name { color: var(--muted); }
.meal-desc {
  font-size: .75rem;
  color: var(--muted);
  line-height: 1.4;
  margin-top: .15rem;
}
.meal-badge {
  font-size: .55rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--black);
  border: 1px solid var(--black);
  padding: .15rem .45rem;
  align-self: flex-start;
  margin-top: .15rem;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── DAY COMPLETE ── */
.day-complete {
  padding: 2rem 1.25rem;
  text-align: center;
  border-top: 1px solid var(--border);
}
.day-complete-title {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 300;
  font-style: italic;
  margin-bottom: .4rem;
}
.day-complete-sub {
  font-size: .75rem;
  color: var(--muted);
  letter-spacing: .05em;
}

/* ── RECIPE PAGE ── */
.recipe-day-nav {
  display: flex;
  overflow-x: auto;
  gap: 0;
  border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.recipe-day-nav::-webkit-scrollbar { display: none; }
.recipe-day-btn {
  flex-shrink: 0;
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  padding: .65rem .9rem;
  font-family: var(--sans);
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  line-height: 1.5;
}
.recipe-day-btn.active {
  background: var(--black);
  color: var(--white);
  border-color: var(--black);
}
.recipe-header { padding: 2rem 1.25rem 1.25rem; border-bottom: 1px solid var(--border); }
.recipe-tag {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .75rem;
}
.recipe-title {
  font-family: var(--serif);
  font-size: 1.8rem;
  font-weight: 300;
  line-height: 1.2;
  margin-bottom: .5rem;
}
.recipe-meta-row {
  display: flex;
  gap: 1rem;
  font-size: .65rem;
  color: var(--muted);
  letter-spacing: .05em;
}
.recipe-note {
  font-size: .78rem;
  font-style: italic;
  color: var(--muted);
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: var(--off-white);
}
.recipe-section-label {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 1.25rem 1.25rem .6rem;
}
.recipe-ing-list { list-style: none; }
.recipe-ing-list li {
  display: flex;
  gap: .75rem;
  padding: .65rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: .88rem;
  line-height: 1.4;
  align-items: flex-start;
}
.recipe-ing-list li::before {
  content: '—';
  color: var(--muted-light);
  flex-shrink: 0;
  font-weight: 300;
}
.recipe-steps-list {
  list-style: none;
  counter-reset: steps;
}
.recipe-steps-list li {
  counter-increment: steps;
  display: flex;
  gap: 1rem;
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: .875rem;
  line-height: 1.5;
  align-items: flex-start;
}
.recipe-steps-list li::before {
  content: counter(steps);
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 300;
  color: var(--muted-light);
  flex-shrink: 0;
  min-width: 16px;
  text-align: right;
  margin-top: -.05rem;
}

/* ── CALENDAR MEAL ROWS ── */
.cal-meal-row {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .85rem 1.25rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  -webkit-user-select: none;
  user-select: none;
}
.cal-meal-row:active { background: var(--off-white); }
.cal-meal-row-body { flex: 1; min-width: 0; }
.cal-meal-row-time {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: .12rem;
}
.cal-meal-row-name {
  font-family: var(--serif);
  font-size: .95rem;
  font-weight: 400;
  color: var(--black);
}
.cal-meal-row-desc {
  font-size: .72rem;
  color: var(--muted);
  margin-top: .1rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(100vw - 5rem);
}
.cal-meal-chevron {
  font-size: 1rem;
  color: var(--muted-light);
  flex-shrink: 0;
  font-weight: 300;
}
.cal-day-shop-btn {
  display: block;
  width: calc(100% - 2.5rem);
  margin: 1rem 1.25rem .5rem;
  background: none;
  border: 1px solid var(--black);
  color: var(--black);
  padding: .65rem 1.5rem;
  font-family: var(--sans);
  font-size: .65rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
}
.cal-day-shop-btn:hover,
.cal-day-shop-btn:active { background: var(--black); color: var(--white); }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 300;
  padding: env(safe-area-inset-top, 1.5rem) 0 env(safe-area-inset-bottom, 0) 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.modal-overlay.open { display: block; }
.modal {
  background: var(--white);
  width: 100%;
  max-width: 540px;
  margin: 4rem auto 2rem;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
@media (max-width: 580px) {
  .modal { margin: auto; min-height: 100svh; box-shadow: none; }
}
.modal-close {
  position: absolute;
  top: 1rem;
  right: 1.25rem;
  background: none;
  border: none;
  font-size: 1rem;
  cursor: pointer;
  color: var(--muted);
  z-index: 2;
  padding: .25rem;
  line-height: 1;
}
.modal-header {
  padding: 1.75rem 3rem 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
}
.modal-category {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .5rem;
}
.modal-title {
  font-family: var(--serif);
  font-size: 1.45rem;
  font-weight: 300;
  line-height: 1.2;
  margin-bottom: .4rem;
}
.modal-meta {
  font-size: .65rem;
  color: var(--muted);
  letter-spacing: .05em;
}
.modal-add-btn {
  display: block;
  width: calc(100% - 2.5rem);
  margin: 1rem 1.25rem;
  background: var(--black);
  color: var(--white);
  border: none;
  padding: .75rem 1.5rem;
  font-family: var(--sans);
  font-size: .65rem;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .2s;
  text-align: center;
}
.modal-add-btn.added { background: var(--green); }

/* ── CALENDAR PAGE ── */
.cal-month-label {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 300;
  font-style: italic;
  padding: 1.5rem 1.25rem .75rem;
  border-bottom: 1px solid var(--border);
  color: var(--black);
}
.cal-week-headers {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
}
.cal-wh {
  font-size: .55rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  padding: .5rem 0;
  border-right: 1px solid var(--border);
}
.cal-wh:last-child { border-right: none; }
.cal-grid-wrap {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}
.cal-cell {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: .6rem .4rem;
  cursor: pointer;
  transition: background .15s;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell:active { background: var(--off-white); }
.cal-cell-num {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 300;
  color: var(--muted-light);
}
.cal-cell-date { font-size: .5rem; color: var(--muted-light); letter-spacing: .05em; }
.cal-cell-rec {
  font-size: .5rem;
  font-weight: 500;
  letter-spacing: .08em;
  color: var(--muted-light);
  text-transform: uppercase;
}
.cal-cell.done .cal-cell-num { color: var(--black); }
.cal-cell.done .cal-cell-date,
.cal-cell.done .cal-cell-rec { color: var(--muted); }
.cal-cell.done { background: var(--off-white); }
.cal-cell.today { background: var(--black); }
.cal-cell.today .cal-cell-num,
.cal-cell.today .cal-cell-date,
.cal-cell.today .cal-cell-rec { color: var(--white); }
.cal-detail {
  border-top: 1px solid var(--border);
}

/* ── RULES PAGE ── */
.rules-hero {
  background: var(--black);
  color: var(--white);
  padding: 2rem 1.25rem;
  text-align: center;
}
.rules-hero-kicker {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.4);
  margin-bottom: .75rem;
}
.rules-hero-title {
  font-family: var(--serif);
  font-size: 1.6rem;
  font-weight: 300;
  font-style: italic;
  color: var(--white);
}
.rule-row {
  display: flex;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.rule-num {
  font-family: var(--serif);
  font-size: 1.3rem;
  font-weight: 300;
  color: var(--muted-light);
  min-width: 20px;
  flex-shrink: 0;
}
.rule-text {
  font-size: .875rem;
  line-height: 1.5;
  padding-top: .15rem;
}
.rule-text strong { font-weight: 500; }

/* ── FRUIT LIST ── */
.fruit-grid {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  padding: 0 1.25rem 1.25rem;
}
.fruit-tag {
  font-size: .72rem;
  color: var(--black);
  border: 1px solid var(--border);
  padding: .25rem .65rem;
  letter-spacing: .03em;
}
.fruit-avoid-note {
  font-size: .75rem;
  color: var(--muted);
  font-style: italic;
  padding: 0 1.25rem 1.25rem;
}

/* ── SHOPPING PAGE ── */
.shop-group-label {
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 1.25rem 1.25rem .6rem;
  border-bottom: 1px solid var(--border);
}
.shop-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  -webkit-user-select: none;
  user-select: none;
}
.shop-row:active { background: var(--off-white); }
.shop-box {
  width: 16px;
  height: 16px;
  min-width: 16px;
  border: 1px solid var(--muted-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .6rem;
  transition: all .2s;
  flex-shrink: 0;
}
.shop-row.bought .shop-box {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}
.shop-row.bought .shop-label {
  text-decoration: line-through;
  color: var(--muted);
}
.shop-label { font-size: .875rem; line-height: 1.4; }
.shop-reset-row {
  padding: 1.25rem;
  text-align: center;

const getState = () => { try { return JSON.parse(localStorage.getItem('d21') || '{}'); } catch { return {}; } };

function getTodayDay() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const start = new Date(2026, 4, 3);
  return Math.floor((today - start) / 86400000) + 1;
}

function getPhase() {
  if (FORCE_GREEN_PHASE) return 'green';
  const n = getTodayDay();
  if (n < 1) return 'pre';
  if (n <= 21) return 'detox';
  return 'green';
}

function getGreenDay() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const greenStart = new Date(2026, 4, 24);
  return Math.floor((today - greenStart) / 86400000) + 1;
}

function getGPDayMenu(gpDay) {
  const template = GP_WEEK_TEMPLATES[Math.floor((gpDay - 1) / 7) % 4];
  return template[(gpDay - 1) % 7];
}

function hasRotationWarning(gpDay) {
  if (gpDay <= 1) return false;
  return getGPDayMenu(gpDay).p === getGPDayMenu(gpDay - 1).p;
}

function gpDateFromDay(gpDay) {
  const d = new Date(2026, 4, 24);
  d.setDate(d.getDate() + gpDay - 1);
  return d;
}

function formatGPDate(gpDay) {
  const d = gpDateFromDay(gpDay);
  return `${d.getDate()}/${d.getMonth() + 1}`;
}

function getCurrentMealIdx() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const times = [6*60+15, 9*60, 12*60, 15*60, 18*60, 21*60];
  let idx = -1;
  for (let i = 0; i < times.length; i++) if (mins >= times[i] - 15) idx = i;
  return idx;
}

function getNextMealIdx() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const times = [6*60+15, 9*60, 12*60, 15*60, 18*60, 21*60];
  for (let i = 0; i < times.length; i++) if (mins < times[i]) return i;
  return -1;
}

function getSecsToNext() {
  const now = new Date();
  const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const times = [(6*60+15)*60, 9*60*60, 12*60*60, 15*60*60, 18*60*60, 21*60*60];
  for (let i = 0; i < times.length; i++) if (secs < times[i]) return { idx: i, secs: times[i] - secs };
  return { idx: 0, secs: 86400 - secs + (6*60+15)*60 };
}

function renderToday() {
  const n = getTodayDay();
  const el = document.getElementById('page-today');
  const headerLabel = document.getElementById('header-day-label');

  if (n < 1) {
    headerLabel.textContent = 'Imorgon startar det';
    el.innerHTML = `
      <div class="pre-start">
        <div class="pre-start-kicker">30 mars 2026</div>
        <div class="pre-start-title">Detoxen börjar imorgon</div>
        <div class="pre-start-body">Dag 1 startar kl. 06:15.<br>Köp in maten och läs igenom alla regler idag.</div>
      </div>`;
    return;
  }
  if (n > 21) {
    renderTodayGreen();
    return;
  }

  const day = DAYS[n - 1];
  const state = getState();
  headerLabel.textContent = `Dag ${n} av 21`;
  document.getElementById('header-wordmark').textContent = 'Detox 21';

  // HERO
  let hero = `
    <div class="hero">
      <div class="hero-kicker">Patrik Rees · MediBalans</div>
      <div class="hero-day-num">${n}<span class="hero-day-total"> /21</span></div>
      <div class="hero-divider"></div>
      <div class="hero-date">${day.wd} ${day.date}</div>
      <div class="hero-theme">${day.theme}</div>
      <div class="hero-recipe">${day.name}</div>
    </div>`;

  // TIMER
  const nextInfo = getSecsToNext();
  const nextMeal = MEALS[nextInfo.idx];
  const h = Math.floor(nextInfo.secs / 3600);
  const m = Math.floor((nextInfo.secs % 3600) / 60);
  const s = nextInfo.secs % 60;
  const timeStr = h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;

  let timer = `
    <div class="timer-wrap">
      <div>
        <div class="timer-label">Nastan dags</div>
        <div class="timer-meal">${nextMeal.time} — ${nextMeal.name}</div>
      </div>
      <div class="timer-countdown" id="timer-val">${timeStr}</div>
    </div>`;

  // PROGRESS
  const done = Math.min(n - 1, 21);
  const pct = Math.round(done / 21 * 100);
  let dots = '';
  for (let i = 1; i <= 21; i++) {
    const isDone = getState()[`day_done_${i}`] || i < n;
    const isToday = i === n;
    let cls = 'p-dot';
    if (isDone) cls += ' done';
    if (isToday) cls += ' today';
    dots += `<div class="${cls}" title="Dag ${i}">${i === 21 ? '★' : i}</div>`;
  }
  let progress = `
    <div class="progress-section">
      <div class="progress-meta">
        <div class="progress-label-text">Genomfort</div>
        <div class="progress-fraction">${done} / 21</div>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-dots">${dots}</div>
    </div>`;

  // MEALS
  const curIdx = getCurrentMealIdx();
  const nxtIdx = getNextMealIdx();
  let meals = `<div class="section-label" style="padding:1rem 1.25rem .1rem;">Dagens schema</div>`;

  MEALS.forEach((meal, i) => {
    const key = `d${n}_${meal.key}`;
    const checked = !!state[key];
    const isCurrent = i === curIdx;
    const isNext = i === nxtIdx;
    const desc = meal.isRecipe ? `${meal.desc} — ${day.name}${day.protein ? ' (' + day.protein + ')' : ''}` : meal.desc;

    let cls = 'meal-item';
    if (checked) cls += ' checked';
    else if (isCurrent) cls += ' current';

    let badge = '';
    if (!checked && isCurrent) badge = '<div class="meal-badge">Nu</div>';
    else if (!checked && isNext) badge = '<div class="meal-badge">Nastan</div>';

    meals += `
      <div class="${cls}" onclick="toggleMeal('${key}', ${n})">
        <div class="meal-check-box">${checked ? '✓' : ''}</div>
        <div class="meal-body">
          <div class="meal-time-row">
            <span class="meal-time">${meal.time}</span>
          </div>
          <div class="meal-name">${meal.name}</div>
          <div class="meal-desc">${desc}</div>
        </div>
        ${badge}
      </div>`;
  });

  // Day complete check
  const allDone = MEALS.every(m => state[`d${n}_${m.key}`]);
  if (allDone) {
    const s2 = getState(); s2[`day_done_${n}`] = true; setState(s2);
    const nextDay = n < 21 ? DAYS[n] : null;
    meals += `
      <div class="day-complete">
        <div class="day-complete-title">${n === 21 ? 'Detoxen genomförd' : 'Dag ' + n + ' genomförd'}</div>
        <div class="day-complete-sub">${nextDay ? 'Imorgon: ' + nextDay.name : 'Patrik Rees — 21 dagar klara.'}</div>
      </div>`;
  }

  el.innerHTML = hero + timer + progress + meals;
}

  const filters = ['alla', ...Object.keys(GP_FILTER_LABELS)];

function getMealDetail(mealKey, dayNum) {
  const day  = DAYS[dayNum - 1];
  const meal = MEALS.find(m => m.key === mealKey);
  if (meal.isRecipe) {
    const rec = RECIPES[day.recipe];
    return {
      name:     rec.title,
      category: `${meal.name} · ${meal.time} · Recept ${day.recipe}`,
      time:     rec.time,
      portions: rec.portions,
      note:     rec.note,
      ing:      rec.ing,
      steps:    rec.steps,
    };
  }
  const fixed = FIXED_MEALS[mealKey];
  return {
    name:     fixed.name,
    category: fixed.category,
    ing:      fixed.ing,
    steps:    fixed.steps,
  };
}

window.showMealModal = function(mealKey, dayNum) {
  const d   = getMealDetail(mealKey, dayNum);

window.addMealIngToShop = function(mealKey, dayNum, btn) {
  const detail = getMealDetail(mealKey, dayNum);
  const s = getState();
  // Append to the main shopping list as custom items
  const existing = s.custom_shop || [];
  detail.ing.forEach(ing => {

  setState(s);

function resizeImageToDataUrl(file, maxPx, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Kunde inte läsa bildfilen.'));
    reader.onload = () => {
      const dataUrl = reader.result;
      if (!dataUrl.startsWith('data:image')) {
        return reject(new Error('Bilden har fel format. Prova ett annat foto.'));
      }
      const img = new Image();
      img.onerror = () => reject(new Error('Bilden kunde inte avkodas.'));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else       { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  });
}

window.analyzeMenu = async function() {
  const fileInput = document.getElementById('menu-file-input');
  const file = fileInput.files[0];
  if (!file) return;

  const btn = document.getElementById('menu-analyze-btn');
  const loading = document.getElementById('menu-loading');
  const result = document.getElementById('menu-result');
  const errorEl = document.getElementById('menu-error');

  btn.disabled = true;
  loading.classList.add('visible');
  result.classList.remove('visible');
  errorEl.classList.remove('visible');

  try {
    // Resize to max 1024px and convert to JPEG to keep payload small and format consistent
    const image = await resizeImageToDataUrl(file, 1024, 0.85);

    const res = await fetch('/.netlify/functions/analyze-menu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image }),
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error || 'Okänt fel.');
    }

    document.getElementById('res-basta-val').textContent = data.basta_val ?? '—';

    const beOm = document.getElementById('res-be-om');
    beOm.innerHTML = (data.be_om_andring ?? []).map(t => `<li>${t}</li>`).join('') || '<li>Inga ändringar behövs.</li>';

    const undvik = document.getElementById('res-undvik');
    undvik.innerHTML = (data.undvik ?? []).map(t => `<li>${t}</li>`).join('') || '<li>—</li>';

    const risk = (data.riskniva ?? 'medium').toLowerCase().trim();
    const riskLabel = { low: 'Låg risk', medium: 'Medel risk', high: 'Hög risk' }[risk] ?? risk;
    document.getElementById('res-risk-badge').innerHTML = `<span class="menu-risk-badge ${risk}">${riskLabel}</span>`;
    document.getElementById('res-risk-text').textContent = data.riskniva_motivering ?? '';

    document.getElementById('res-fallback').textContent = data.om_inget_funkar ?? '—';

    result.classList.add('visible');
  } catch (err) {
    errorEl.textContent = err.message || 'Något gick fel. Försök igen.';
    errorEl.classList.add('visible');
  } finally {
    loading.classList.remove('visible');
    btn.disabled = false;
  }
};

}

// ─── NAV ─────────────────────────────────────────────────────────────────────

window.showPage = function(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  const order = ['today','recipe','calendar','rules','shop','menu','guide'];
  document.querySelectorAll('.nav-tab')[order.indexOf(page)]?.classList.add('active');
  if (page === 'recipe') renderRecipe();
  if (page === 'calendar') renderCalendar();
  if (page === 'rules') renderRules();
  if (page === 'shop') renderShop();
  if (page === 'menu') {
    if (getPhase() === 'green') {
      const gpDay = getGreenDay();
      activeGPWeek = Math.min(Math.ceil(gpDay / 7), 13);
    }
    renderMenu();
  }
  if (page === 'guide') renderGuide();
};

// ─── TIMER TICK ──────────────────────────────────────────────────────────────

function tickTimer() {
  const el = document.getElementById('timer-val');
  if (!el) return;
  const { secs } = getSecsToNext();
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  el.textContent = h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
}

// ─── PWA ─────────────────────────────────────────────────────────────────────

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

renderToday();
renderRules();
setInterval(tickTimer, 1000);
setInterval(() => {
  if (document.getElementById('page-today').classList.contains('active')) renderToday();
}, 60000);
</script>
</body>
